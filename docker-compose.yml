services:
  demo-lab:
    build: .
    container_name: sentinel-demo-lab
    command: ["python", "-m", "demo_lab.app"]
    environment:
      - SENTINEL_DEMO_HOST=0.0.0.0
      - SENTINEL_DEMO_PORT=5050
      - SENTINEL_DOCKER_MODE=1
    ports:
      - "127.0.0.1:5050:5050"

  sentinel-ai:
    build: .
    container_name: sentinel-ai-dashboard
    depends_on:
      - demo-lab
    environment:
      - SENTINEL_ALLOWED_DOCKER_HOSTS=demo-lab,sentinel-demo-lab
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
